name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { node: [20, 22] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci --no-audit --no-fund
        working-directory: model-gateway
      - run: npm run build
        working-directory: model-gateway
      - name: gateway tests
        run: node --test --test-reporter=tap test/gateway.test.mjs
        working-directory: model-gateway
      - name: installer selftest (fake CLIs, mock provider)
        run: bash setup/selftest.sh
